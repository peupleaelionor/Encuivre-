name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + DB integration tests
        # DB/permission tests run against PGlite (embedded Postgres) — no service
        # container or secret required. See docs/database.md.
        env:
          ENCUIVRE_DB_PATH: ":memory:"
        run: npm test

      - name: Build
        run: npm run build
